name: Coletar SIOP por ano - independente e revisavel
on:
  schedule:
    - cron: '25 8 1 * *'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano individual; selecione 2011 a 2026'
        type: choice
        options: ['2011','2012','2013','2014','2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025','2026']
        default: '2022'
      lote_historico:
        description: 'Coletar TODOS os anos, independentemente (um ano pode falhar sem cancelar os outros)'
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      anos: ${{ steps.anos.outputs.anos }}
    steps:
      - name: Definir anos da execução
        id: anos
        env:
          EVENT: ${{ github.event_name }}
          ANO: ${{ inputs.ano }}
          LOTE: ${{ inputs.lote_historico }}
        shell: bash
        run: |
          if [ "$EVENT" = schedule ]; then
            echo 'anos=[2026]' >> "$GITHUB_OUTPUT"
          elif [ "$LOTE" = true ]; then
            echo 'anos=[2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]' >> "$GITHUB_OUTPUT"
          else
            [[ "$ANO" =~ ^20(1[1-9]|2[0-6])$ ]] || { echo 'Ano inválido'; exit 1; }
            echo "anos=[$ANO]" >> "$GITHUB_OUTPUT"
          fi
  coletar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ano: ${{ fromJSON(needs.preparar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar base antes de coletar
        run: |
          python scripts/validate.py
          python scripts/validar_v5.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Coletar e verificar SOMENTE o ano ${{ matrix.ano }}
        run: python scripts/siop_incremental.py --ano ${{ matrix.ano }}
      - name: Salvar auditoria mesmo se houver bloqueio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siop-auditoria-${{ matrix.ano }}
          path: |
            reports/siop_${{ matrix.ano }}.json
            reports/siop_${{ matrix.ano }}.csv
          retention-days: 30
          if-no-files-found: ignore
      - name: Conferir que a coleta não alterou o portal publicado
        run: |
          python scripts/validate.py
          python scripts/validar_v5.py
      - name: Criar PR independente para ${{ matrix.ano }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automacao/siop-ano-${{ matrix.ano }}
          delete-branch: true
          add-paths: |
            data/siop_anos/${{ matrix.ano }}*.csv
            data/siop_anos/${{ matrix.ano }}*.json
          commit-message: 'SIOP: registrar ano ${{ matrix.ano }} auditado'
          title: 'Revisar LOA SIOP do ano ${{ matrix.ano }}'
          body: |
            **Etapa 1 de 2 — somente fonte por ano, ainda não altera os gráficos.**
            Arquivo oficial SIOP SHA-256 conferido. Verifique o CSV e a auditoria
            (incluindo Reserva de Contingência fora das 28 funções regulares).
            O exercício vigente recebe uma fotografia por mês; históricos não são sobrescritos.
            **Após merge desta PR:** outro workflow propõe a consolidação para o site.
            Ambas as propostas requerem revisão humana. Nada é aprovado automaticamente.
