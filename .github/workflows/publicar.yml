name: Validar e publicar Brasil em Dados
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar conjunto de dados
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/validate.py
          python scripts/validar_v5.py
      - name: Preparar apenas arquivos publicos
        run: |
          mkdir -p _public/data
          cp index.html styles.css app.js data.js alteracoes.js alteracoes-app.js areas-app.js _public/
          cp data/atlas.json data/orcamento_2020_2024_ibge.csv data/escandalos_investigacoes.csv data/alteracoes_orcamentarias.csv _public/data/
          test -f _public/data/escandalos_investigacoes.csv
          test -f _public/data/atlas.json
          test -f _public/data/orcamento_2020_2024_ibge.csv
          test -f _public/data/alteracoes_orcamentarias.csv
          test -f _public/alteracoes.js
          test -f _public/areas-app.js
          test -f _public/alteracoes-app.js
          touch _public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - id: deploy
        uses: actions/deploy-pages@v4
