name: Validar e publicar Brasil em Dados

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    name: Validar e preparar o site
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar os dados e o site
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/validate.py
          python scripts/validar_v5.py
      - name: Preparar somente arquivos públicos
        run: |
          set -euo pipefail
          mkdir -p _public/data
          cp index.html styles.css app.js data.js alteracoes.js alteracoes-app.js areas-app.js _public/
          cp data/atlas.json data/orcamento_2020_2024_ibge.csv data/escandalos_investigacoes.csv data/alteracoes_orcamentarias.csv _public/data/
          for arquivo in index.html styles.css app.js data.js alteracoes.js alteracoes-app.js areas-app.js; do
            test -s "_public/$arquivo"
          done
          for arquivo in atlas.json orcamento_2020_2024_ibge.csv escandalos_investigacoes.csv alteracoes_orcamentarias.csv; do
            test -s "_public/data/$arquivo"
          done
          touch _public/.nojekyll
          echo 'Arquivos preparados para publicação:'
          find _public -type f | sort
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar pacote github-pages
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _public/
          retention-days: 2
      - name: Confirmar que o pacote foi criado
        env:
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo '::error::O upload não retornou o ID do pacote github-pages.'
            exit 1
          fi
          echo "Pacote github-pages enviado com ID: $ARTIFACT_ID"

  publicar:
    name: Publicar no GitHub Pages
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar pacote github-pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
