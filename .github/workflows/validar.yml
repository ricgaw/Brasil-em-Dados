name: Validar site nacional
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar dados e fontes
        run: |
          PYTHONUTF8=1 python scripts/validate.py
          PYTHONUTF8=1 python scripts/validar_v5.py
